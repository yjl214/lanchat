name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'          # 改成你本地验证过的版本
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (spec)
        run: pyinstaller lanchat.spec --noconfirm --clean

      - name: List dist output (debug)
        run: dir dist\
        shell: cmd

      - name: Upload artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: lanchat-windows
          path: dist/lanchat.exe
          retention-days: 14

      # 只有打 tag 才发 Release
      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/lanchat.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
